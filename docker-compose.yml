services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  wallet-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      DB_USERNAME: wallet
      DB_PASSWORD: wallet
      JWT_SECRET: change-this-to-a-long-random-secret-of-32-plus-chars
      ADMIN_EMAIL: admin@wallet.local
      ADMIN_PASSWORD: Admin@12345
      WALLET_FUNDING_ENABLED: "true"
    ports:
      - "9090:9090"
