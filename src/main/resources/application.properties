spring.application.name=three-line-wallet
server.port=${SERVER_PORT:9090}
server.shutdown=graceful

# ---------------------------------------------------------------------------
# Logging
# Every line carries the request id and user id (see RequestLoggingFilter and CurrentUserMdcInterceptor),
# so one request can be followed end to end and matched to its audit events and X-Request-Id header.
# JSON logs for log aggregators: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash).
# Log to a file as well: set LOGGING_FILE_NAME=logs/wallet.log (rotated by Spring Boot's defaults).
# ---------------------------------------------------------------------------
logging.pattern.level=%5p [req=%X{requestId:-} user=%X{userId:-}]
logging.level.root=INFO
logging.level.com.example.test=${LOG_LEVEL:INFO}
# Audit events are mirrored to this logger; keep it at INFO so they always reach the logs.
logging.level.AUDIT=INFO
# Set to DEBUG to see SQL (and org.hibernate.orm.jdbc.bind=TRACE for parameter values) while debugging.
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

# ---------------------------------------------------------------------------
# Datasource. Defaults to an in-memory H2 database running in PostgreSQL mode.
# Point DB_URL / DB_USERNAME / DB_PASSWORD at PostgreSQL for a real database.
# The JDBC driver and Hibernate dialect are auto-detected from the URL.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:walletdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate never alters it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# API docs and operations
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# HS256 signing secret: at least 32 bytes. The default is for local runs only; always set JWT_SECRET elsewhere.
wallet.security.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
wallet.security.jwt.issuer=three-line-wallet
wallet.security.jwt.ttl=${JWT_TTL:60m}
# Transaction PIN: this many wrong PINs in a row lock it for the given duration.
wallet.security.pin.max-attempts=${PIN_MAX_ATTEMPTS:3}
wallet.security.pin.lock-duration=${PIN_LOCK_DURATION:30m}
# Bootstrap admin, created on startup if missing. Leave ADMIN_EMAIL empty to skip.
wallet.security.admin.email=${ADMIN_EMAIL:admin@wallet.local}
wallet.security.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---------------------------------------------------------------------------
# Wallet settings
# ---------------------------------------------------------------------------
# Demo-only admin endpoint that credits a wallet without a real payment source.
# Disable (WALLET_FUNDING_ENABLED=false) anywhere outside local testing.
wallet.funding.enabled=${WALLET_FUNDING_ENABLED:true}
